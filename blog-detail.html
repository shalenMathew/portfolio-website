<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to blog | Shalen Mathew</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css?v=20260422">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #efefee;
            color: #4d4d4d;
        }

        .redirect-card {
            width: min(560px, 100%);
            background: white;
            border: 1px solid rgba(208, 64, 51, 0.14);
            border-radius: 18px;
            padding: 32px 28px;
            box-shadow: 0 18px 40px rgba(58, 58, 58, 0.06);
        }

        .redirect-card h1 {
            margin: 0 0 12px;
            color: #d04033;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
        }

        .redirect-card p {
            margin: 0 0 18px;
            line-height: 1.6;
        }

        .redirect-link {
            color: #d04033;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="redirect-card">
        <h1>Redirecting...</h1>
        <p>If you're not redirected automatically, use the link below.</p>
        <p><a class="redirect-link" id="fallbackLink" href="blog.html">Go to blogs</a></p>
    </main>

    <script>
        async function redirectToStandaloneBlog() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const fallbackLink = document.getElementById('fallbackLink');

            if (!slug) {
                fallbackLink.href = 'blog.html';
                return;
            }

            try {
                const response = await fetch('blogs/Manifest/manifest.json');
                const blogs = await response.json();
                const blog = blogs.find((entry) => entry.slug === slug);

                if (blog && blog.url) {
                    fallbackLink.href = blog.url;
                    window.location.replace(blog.url);
                    return;
                }
            } catch (error) {
                console.error('Redirect failed:', error);
            }

            fallbackLink.href = 'blog.html';
        }

        redirectToStandaloneBlog();
    </script>
</body>
</html>
