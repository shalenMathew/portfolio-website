<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening post — Shalen Mathew</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/profileImg.png">
    <link rel="stylesheet" href="style.css?v=20260601">
    <style>
        body.blog-detail-page {
            margin: 0;
            min-height: 100vh;
            padding: 0;
            background: var(--bg-grey);
            color: var(--text-dark);
            font-family: var(--body-font);
            -webkit-font-smoothing: antialiased;
        }

        .blog-detail-shell {
            width: min(640px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(48px, 8vh, 88px) clamp(20px, 5vw, 32px) 72px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: blog-detail-fade 700ms ease both;
        }

        @keyframes blog-detail-fade {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .blog-detail-top {
            margin-bottom: 48px;
        }

        .blog-detail-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--theme-red);
            margin-bottom: 18px;
        }

        .blog-detail-brand {
            margin: 0;
            font-size: clamp(1.45rem, 4.5vw, 1.85rem);
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.2;
            color: var(--text-dark);
        }

        .blog-detail-main {
            width: 100%;
            max-width: 420px;
        }

        .blog-detail-status {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .blog-detail-loader {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .blog-detail-loader span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--theme-red);
            opacity: 0.35;
            animation: blog-detail-pulse 1.1s ease-in-out infinite;
        }

        .blog-detail-loader span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .blog-detail-loader span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes blog-detail-pulse {
            0%, 80%, 100% {
                opacity: 0.35;
                transform: scale(1);
            }
            40% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        .blog-detail-message {
            margin: 0;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-dark);
        }

        .blog-detail-hint {
            margin: 0;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #6a6a6a;
        }

        .blog-detail-post-title {
            margin: 4px 0 0;
            font-size: clamp(1.05rem, 2.8vw, 1.2rem);
            font-weight: 600;
            line-height: 1.45;
            color: var(--text-dark);
        }

        .blog-detail-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid rgba(58, 58, 58, 0.08);
            width: 100%;
        }

        .blog-detail-link {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--theme-red);
            text-decoration: none;
            transition: opacity 160ms ease, transform 160ms ease;
        }

        .blog-detail-link:hover,
        .blog-detail-link:focus-visible {
            opacity: 0.85;
            transform: translateX(-2px);
        }

        .blog-detail-link.is-muted {
            font-weight: 500;
            color: #8a8a8a;
        }

        .blog-detail-link.is-muted:hover,
        .blog-detail-link.is-muted:focus-visible {
            color: var(--theme-red);
        }

        .blog-detail-shell.is-error .blog-detail-loader {
            display: none;
        }

        .blog-detail-shell.is-error .blog-detail-message {
            color: var(--theme-red);
        }

        @media (prefers-reduced-motion: reduce) {
            .blog-detail-shell {
                animation: none;
            }

            .blog-detail-loader span {
                animation: none;
                opacity: 0.6;
            }

            .blog-detail-link {
                transition: none;
            }
        }
    </style>
</head>
<body class="blog-detail-page">
    <div class="blog-detail-shell" id="shell">
        <header class="blog-detail-top">
            <img class="blog-detail-avatar" src="assets/profileImg.png" alt="Shalen Mathew" width="76" height="76">
            <p class="blog-detail-brand">Shalen Mathew's space</p>
        </header>

        <main class="blog-detail-main">
            <div class="blog-detail-status" id="statusBlock">
                <div class="blog-detail-loader" id="loader" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p class="blog-detail-message" id="statusMessage">Opening your post…</p>
                <p class="blog-detail-post-title" id="postTitle" hidden></p>
                <p class="blog-detail-hint" id="statusHint">You’ll be redirected in a moment.</p>
            </div>

            <div class="blog-detail-actions" id="actions" hidden>
                <a class="blog-detail-link" id="fallbackLink" href="blog.html">Continue to post</a>
                <a class="blog-detail-link is-muted" href="blog.html">&larr; All writing</a>
            </div>
        </main>
    </div>

    <script>
        const shell = document.getElementById('shell');
        const loader = document.getElementById('loader');
        const statusMessage = document.getElementById('statusMessage');
        const postTitle = document.getElementById('postTitle');
        const statusHint = document.getElementById('statusHint');
        const actions = document.getElementById('actions');
        const fallbackLink = document.getElementById('fallbackLink');

        function showError(message) {
            shell.classList.add('is-error');
            loader.hidden = true;
            statusMessage.textContent = message;
            postTitle.hidden = true;
            statusHint.textContent = 'Use the links below to continue.';
            actions.hidden = false;
        }

        function showPostFound(blog) {
            document.title = `${blog.title} — Shalen Mathew`;
            postTitle.textContent = blog.title;
            postTitle.hidden = false;
            statusHint.textContent = 'Redirecting you now…';
            fallbackLink.href = blog.url;
            fallbackLink.textContent = 'Continue to post';
        }

        async function redirectToStandaloneBlog() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                showError('No post specified.');
                fallbackLink.href = 'blog.html';
                fallbackLink.textContent = 'Go to writing';
                return;
            }

            try {
                const response = await fetch('blogs/Manifest/manifest.json');
                const blogs = await response.json();
                const blog = blogs.find((entry) => entry.slug === slug);

                if (blog && blog.url) {
                    showPostFound(blog);
                    window.location.replace(blog.url);
                    return;
                }

                showError('This post couldn’t be found.');
                fallbackLink.href = 'blog.html';
                fallbackLink.textContent = 'Browse all posts';
            } catch (error) {
                console.error('Redirect failed:', error);
                showError('Something went wrong.');
                fallbackLink.href = 'blog.html';
                fallbackLink.textContent = 'Go to writing';
            }
        }

        redirectToStandaloneBlog();
    </script>
</body>
</html>
