<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="blog, technology, development, Android, JavaScript, programming">

    <meta property="og:image" content="https://shalenmathew.github.io/Portfolio-Website/assets/Blog.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Shalen Mathew - Blog">
    <meta name="twitter:description" content="Read my latest blog posts on technology and development.">
    <meta name="twitter:image" content="https://shalenmathew.github.io/Portfolio-Website/assets/Blog.png">

    <link rel="stylesheet" href="style.css?v=20260422">
    <link rel="canonical" href="https://shalenmathew.github.io/Portfolio-Website/blog.html">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Shalen Mathew - Blog",
        "description": "Blog posts on technology, development, and creative insights",
        "url": "https://shalenmathew.github.io/Portfolio-Website/blog.html",
        "author": {
            "@type": "Person",
            "name": "Shalen Mathew",
            "url": "https://shalenmathew.github.io/Portfolio-Website/"
        }
    }
    </script>
    <style>
        .blogs-page-container {
            width: 100%;
            background-color: #efefee;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 72px 7vw;
            min-height: 100vh;
        }

        .blogs-page-wrapper {
            width: 100%;
            max-width: 1120px;
        }

        .blogs-page-header {
            margin-bottom: 64px;
            animation: fade-up 700ms ease both;
        }

        .blogs-page-title {
            font-family: 'MySolidGraffiti', sans-serif;
            font-size: clamp(4rem, 6.5vw, 6.1rem);
            color: #d04033;
            margin-bottom: 12px;
            line-height: 0.95;
            font-weight: normal;
        }

        .blogs-page-subtitle {
            color: #4d4d4d;
            font-size: clamp(1.3rem, 1.8vw, 1.6rem);
            font-weight: 300;
            line-height: 1.45;
            max-width: 760px;
        }

        .blogs-page-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fade-up 800ms ease both;
        }

        .blog-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 32px 28px;
            background: white;
            border: 1px solid rgba(208, 64, 51, 0.12);
            border-radius: 16px;
            text-decoration: none;
            color: #4d4d4d;
            transition: all 240ms cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .blog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d04033, rgba(208, 64, 51, 0.3));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 240ms ease;
        }

        .blog-card:hover {
            border-color: rgba(208, 64, 51, 0.24);
            box-shadow: 0 16px 40px rgba(208, 64, 51, 0.12);
            transform: translateY(-4px);
        }

        .blog-card:hover::before {
            transform: scaleX(1);
        }

        .blog-card-content {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .blog-card-title {
            font-size: clamp(1.25rem, 1.6vw, 1.5rem);
            font-weight: 700;
            color: #3a3a3a;
            line-height: 1.3;
            transition: color 240ms ease;
            margin: 0;
        }

        .blog-card:hover .blog-card-title {
            color: #d04033;
        }

        .blog-card-description {
            font-size: clamp(1.02rem, 1.3vw, 1.15rem);
            font-weight: 400;
            color: #6a6a6a;
            line-height: 1.6;
            margin: 0;
        }

        .blog-card-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid rgba(208, 64, 51, 0.08);
        }

        .blog-card-date {
            font-size: clamp(0.95rem, 1.1vw, 1.05rem);
            font-weight: 500;
            color: #d04033;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 240ms ease;
        }

        .blog-card:hover .blog-card-date {
            transform: translateX(4px);
        }

        .blog-card-arrow {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: auto;
            color: #d04033;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 240ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blog-card:hover .blog-card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .back-to-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 48px;
            color: #d04033;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            transition: transform 180ms ease;
        }

        .back-to-home:hover {
            transform: translateX(-6px);
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .blogs-page-container {
                padding: 48px 24px;
            }

            .blog-card-meta {
                justify-content: space-between;
            }

            .blogs-page-title {
                font-size: 3.2rem;
            }
        }
    </style>
</head>
<body style="background: #efefee; padding: 0;">
    <div class="blogs-page-container">
        <div class="blogs-page-wrapper">
            <a href="index.html" class="back-to-home">&larr; Back to home</a>

            <div class="blogs-page-header">
                <h1 class="blogs-page-title">BLOGS</h1>
                <p class="blogs-page-subtitle">Here are my latest articles on technology, development, and creative insights.</p>
            </div>

            <div class="blogs-page-list" id="blogList">
                <p style="color: #4d4d4d;">Loading blogs...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadBlogs() {
            try {
                const response = await fetch('blogs/Manifest/manifest.json');
                const blogs = await response.json();

                blogs.sort((a, b) => new Date(b.date) - new Date(a.date));

                const blogList = document.getElementById('blogList');
                blogList.innerHTML = '';

                blogs.forEach((blog) => {
                    const blogCard = document.createElement('a');
                    blogCard.className = 'blog-card';
                    blogCard.href = blog.url;

                    blogCard.innerHTML = `
                        <div class="blog-card-content">
                            <h2 class="blog-card-title">${blog.title}</h2>
                            ${blog.description ? `<p class="blog-card-description">${blog.description}</p>` : ''}
                            <div class="blog-card-meta">
                                <span class="blog-card-date">Published: ${blog.displayDate || blog.date}</span>
                                <span class="blog-card-arrow">&rarr;</span>
                            </div>
                        </div>
                    `;

                    blogList.appendChild(blogCard);
                });
            } catch (error) {
                console.error('Error loading blogs:', error);
                document.getElementById('blogList').innerHTML = '<p style="color: #d04033;">Error loading blogs.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
