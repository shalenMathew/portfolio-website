<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore my blog posts on technology, development, and creative insights. Read articles about Android development, JavaScript, and more.">
    <meta name="keywords" content="blog, technology, development, Android, JavaScript, programming">
    <meta name="author" content="Shalen Mathew">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Shalen Mathew - Blog">
    <meta property="og:description" content="Read my latest blog posts on technology and development.">
    <meta property="og:url" content="https://shalenmathew.github.io/portfolio-website/blog.html">
    <meta property="og:image" content="https://shalenmathew.github.io/portfolio-website/assets/Blog.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Shalen Mathew - Blog">
    <meta name="twitter:description" content="Read my latest blog posts on technology and development.">
    <meta name="twitter:image" content="https://shalenmathew.github.io/portfolio-website/assets/Blog.png">
    <title>Writing — Shalen Mathew</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/profileImg.png">
    <link rel="stylesheet" href="style.css?v=20260601">
    <link rel="canonical" href="https://shalenmathew.github.io/portfolio-website/blog.html">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Shalen Mathew - Blog",
        "description": "Blog posts on technology, development, and creative insights",
        "url": "https://shalenmathew.github.io/portfolio-website/blog.html",
        "author": {
            "@type": "Person",
            "name": "Shalen Mathew",
            "url": "https://shalenmathew.github.io/portfolio-website/"
        }
    }
    </script>
    <style>
        body.blog-page {
            margin: 0;
            min-height: 100vh;
            padding: 0;
            background: var(--bg-grey);
            color: var(--text-dark);
            font-family: var(--body-font);
            -webkit-font-smoothing: antialiased;
        }

        .blog-page-shell {
            width: min(640px, 100%);
            margin: 0 auto;
            padding: clamp(48px, 8vh, 88px) clamp(20px, 5vw, 32px) 72px;
            animation: blog-fade-up 700ms ease both;
        }

        @keyframes blog-fade-up {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .blog-page-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 40px;
        }

        .blog-page-avatar {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--theme-red);
            margin-bottom: 18px;
        }

        .blog-page-brand {
            margin: 0;
            font-size: clamp(1.45rem, 4.5vw, 1.85rem);
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.2;
            color: var(--text-dark);
        }

        .blog-page-lede {
            margin: 0 0 36px;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.65;
            color: #6a6a6a;
            text-align: center;
        }

        .blog-page-list {
            display: flex;
            flex-direction: column;
            gap: 0;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .blog-page-post {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: baseline;
            column-gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid rgba(58, 58, 58, 0.08);
            text-decoration: none;
            color: inherit;
            transition: opacity 160ms ease;
        }

        .blog-page-post:first-child {
            border-top: 1px solid rgba(58, 58, 58, 0.08);
        }

        .blog-page-post:hover .blog-page-post-title,
        .blog-page-post:focus-visible .blog-page-post-title {
            color: var(--theme-red);
        }

        .blog-page-post:focus-visible {
            outline: none;
        }

        .blog-page-post:focus-visible .blog-page-post-title {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .blog-page-post-title {
            font-size: clamp(1.02rem, 2.4vw, 1.12rem);
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-dark);
            transition: color 160ms ease;
        }

        .blog-page-post-date {
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #9a9a9a;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .blog-page-status {
            text-align: center;
            font-size: 0.95rem;
            color: #6a6a6a;
            padding: 24px 0;
        }

        .blog-page-status.is-error {
            color: var(--theme-red);
        }

        .blog-page-footer {
            margin-top: 56px;
            padding-top: 28px;
            border-top: 1px solid rgba(58, 58, 58, 0.08);
            text-align: center;
        }

        .blog-page-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #8a8a8a;
            text-decoration: none;
            transition: color 160ms ease, transform 160ms ease;
        }

        .blog-page-back:hover,
        .blog-page-back:focus-visible {
            color: var(--theme-red);
            transform: translateX(-3px);
        }

        @media (max-width: 520px) {
            .blog-page-post {
                grid-template-columns: 1fr;
                row-gap: 6px;
                padding: 16px 0;
            }

            .blog-page-post-date {
                justify-self: start;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .blog-page-shell {
                animation: none;
            }

            .blog-page-post,
            .blog-page-back,
            .blog-page-post-title {
                transition: none;
            }
        }
    </style>
</head>
<body class="blog-page">
    <div class="blog-page-shell">
        <header class="blog-page-top">
            <img class="blog-page-avatar" src="assets/profileImg.png" alt="Shalen Mathew" width="76" height="76">
            <p class="blog-page-brand">Shalen Mathew's space</p>
        </header>

        <p class="blog-page-lede">
            Notes on Android, architecture, and things I’m learning while building apps and shipping side projects.
        </p>

        <div class="blog-page-list" id="blogList" role="list">
            <p class="blog-page-status">Loading…</p>
        </div>

        <footer class="blog-page-footer">
            <a href="index.html" class="blog-page-back">&larr; Back to portfolio</a>
        </footer>
    </div>

    <script>
        function formatPostDate(blog) {
            if (blog.displayDate) {
                const parts = blog.displayDate.split(/[-/.]/);
                if (parts.length === 3) {
                    const [d, m, y] = parts;
                    const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                    const monthIndex = parseInt(m, 10) - 1;
                    if (monthIndex >= 0 && monthIndex < 12) {
                        return `${d}. ${months[monthIndex]}. ${y}`;
                    }
                }
                return blog.displayDate;
            }

            const parsed = new Date(blog.date);
            if (Number.isNaN(parsed.getTime())) {
                return blog.date || '';
            }

            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            const day = String(parsed.getDate()).padStart(2, '0');
            return `${day}. ${months[parsed.getMonth()]}. ${parsed.getFullYear()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadBlogs() {
            const blogList = document.getElementById('blogList');

            try {
                const response = await fetch('blogs/Manifest/manifest.json');
                const blogs = await response.json();

                blogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                blogList.innerHTML = '';

                if (!blogs.length) {
                    blogList.innerHTML = '<p class="blog-page-status">No posts yet.</p>';
                    return;
                }

                blogs.forEach((blog) => {
                    const post = document.createElement('a');
                    post.className = 'blog-page-post';
                    post.href = blog.url;
                    post.setAttribute('role', 'listitem');
                    post.innerHTML = `
                        <span class="blog-page-post-title">${escapeHtml(blog.title)}</span>
                        <time class="blog-page-post-date" datetime="${escapeHtml(blog.date || '')}">${escapeHtml(formatPostDate(blog))}</time>
                    `;
                    blogList.appendChild(post);
                });
            } catch (error) {
                console.error('Error loading blogs:', error);
                blogList.innerHTML = '<p class="blog-page-status is-error">Couldn’t load posts. Try again later.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogs);
    </script>
</body>
</html>
